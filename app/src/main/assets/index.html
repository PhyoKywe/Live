<!DOCTYPE html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>တိုက်ရိုက်ဘာသာပြန်</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181f;--dim:#5d6676;--line:rgba(255,255,255,.75);--glass:rgba(255,255,255,.55);--acc:#2f6bff;--acc2:#18c6a6;--ok:#12805c;--bad:#c4372b;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:400 16px/1.75 "Noto Sans Myanmar",system-ui,sans-serif;background:#f4f7fb;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.bg i:nth-child(1){width:300px;height:300px;background:#bcd3ff;top:-80px;left:-90px}
.bg i:nth-child(2){width:260px;height:260px;background:#b5f0e2;top:38%;right:-110px}
.bg i:nth-child(3){width:280px;height:280px;background:#ffd9e6;bottom:-90px;left:-60px}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 36px)}
h1{font:700 26px/1.5 "Noto Sans Myanmar",sans-serif;margin:0;letter-spacing:-.2px}
.sub{color:var(--dim);font-size:14px;margin:2px 0 0}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:0 8px 30px rgba(40,60,110,.09),inset 0 1px 0 rgba(255,255,255,.9)}
.hero{margin-top:18px;padding:30px 16px 22px;display:flex;flex-direction:column;align-items:center}
#go{width:128px;height:128px;border-radius:50%;border:1px solid rgba(255,255,255,.9);cursor:pointer;color:var(--ink);font:700 18px/1.3 "Noto Sans Myanmar",sans-serif;background:radial-gradient(circle at 30% 25%,#fff,rgba(255,255,255,.55) 55%,rgba(200,220,255,.5));box-shadow:0 12px 30px rgba(47,107,255,.22),inset 0 2px 6px #fff,inset 0 -8px 18px rgba(47,107,255,.12);position:relative;transition:transform .15s}
#go:active{transform:scale(.96)}
#go::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid transparent}
#go[data-on="true"]{color:#fff;background:linear-gradient(145deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 12px 34px rgba(47,107,255,.45),inset 0 2px 6px rgba(255,255,255,.5)}
#go[data-on="true"]::after{border-color:rgba(47,107,255,.35);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.28);opacity:0}}
@media (prefers-reduced-motion:reduce){#go[data-on="true"]::after{animation:none}}
.st{margin-top:18px;font-size:14px;color:var(--dim);min-height:26px;text-align:center}
.st.ok{color:var(--ok);font-weight:600}.st.bad{color:var(--bad)}
.card{margin-top:14px;padding:18px}
.card h2{font:600 14px/1.5 "Noto Sans Myanmar",sans-serif;color:var(--dim);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(20,24,31,.1);background:rgba(255,255,255,.6);color:var(--ink);border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sl{margin-top:4px}.sl+.sl{margin-top:16px}
.sl div{display:flex;justify-content:space-between;font-size:14px}
.sl b{font-weight:600;color:var(--acc)}
input[type=range]{width:100%;height:28px;accent-color:var(--acc);background:none}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 5px}label:first-of-type{margin-top:0}
select,input[type=text],input[type=password]{width:100%;background:rgba(255,255,255,.7);color:var(--ink);border:1px solid rgba(20,24,31,.1);border-radius:14px;padding:11px 14px;font:inherit;font-size:15px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{font-size:12.5px;color:var(--dim);margin:16px 6px 0}
</style></head>
<body><div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
<h1>တိုက်ရိုက်ဘာသာပြန်</h1>
<p class="sub">YouTube၊ Facebook၊ TikTok အသံကို ချက်ချင်းပြန်ပေးမယ်</p>

<section class="glass hero" aria-label="စတင်ရန်">
 <button id="go" type="button" data-on="false">စတင်မယ်</button>
 <div id="st" class="st" role="status" aria-live="polite">အဆင်သင့်ပါ</div>
</section>

<section class="glass card">
 <h2>ဘာသာပြန်မယ့်ဘာသာစကား</h2>
 <input id="lang" type="hidden" value="Burmese (Myanmar)">
 <div class="chips" id="chips">
  <button class="chip" type="button" data-v="Burmese (Myanmar)">မြန်မာ</button>
  <button class="chip" type="button" data-v="English">English</button>
  <button class="chip" type="button" data-v="Thai">ไทย</button>
  <button class="chip" type="button" data-v="Chinese (Simplified)">中文</button>
  <button class="chip" type="button" data-v="Japanese">日本語</button>
  <button class="chip" type="button" data-v="Korean">한국어</button>
 </div>
</section>

<section class="glass card">
 <h2>အသံ</h2>
 <div class="sl"><div><label for="orig" style="margin:0">မူရင်းအသံ</label><b id="ov"></b></div><input id="orig" type="range" min="0" max="100" value="20"></div>
 <div class="sl"><div><label for="ai" style="margin:0">AI ဘာသာပြန်သံ</label><b id="av"></b></div><input id="ai" type="range" min="0" max="150" value="100"></div>
 <label for="voice" style="margin-top:18px">AI အသံပုံစံ</label>
 <select id="voice"><option value="Zephyr">Zephyr · Bright</option><option value="Puck">Puck · Upbeat</option><option value="Charon">Charon · Informative</option><option value="Kore">Kore · Firm</option><option value="Fenrir">Fenrir · Excitable</option><option value="Leda">Leda · Youthful</option><option value="Orus">Orus · Firm</option><option value="Aoede">Aoede · Breezy</option><option value="Callirhoe">Callirhoe · Easy-going</option><option value="Autonoe">Autonoe · Bright</option><option value="Enceladus">Enceladus · Breathy</option><option value="Iapetus">Iapetus · Clear</option><option value="Umbriel">Umbriel · Easy-going</option><option value="Algieba">Algieba · Smooth</option><option value="Despina">Despina · Smooth</option><option value="Erinome">Erinome · Clear</option><option value="Algenib">Algenib · Gravelly</option><option value="Rasalgethi">Rasalgethi · Informative</option><option value="Laomedeia">Laomedeia · Upbeat</option><option value="Achernar">Achernar · Soft</option><option value="Alnilam">Alnilam · Firm</option><option value="Schedar">Schedar · Even</option><option value="Gacrux">Gacrux · Mature</option><option value="Pulcherrimae">Pulcherrimae · Forward</option><option value="Achird">Achird · Friendly</option><option value="Zubenelgenubi">Zubenelgenubi · Casual</option><option value="Vindemiatrix">Vindemiatrix · Gentle</option><option value="Sadachbia">Sadachbia · Lively</option><option value="Sadaltager">Sadaltager · Knowledgeable</option><option value="Sulafat">Sulafat · Warm</option></select>
</section>

<section class="glass card">
 <h2>ချိတ်ဆက်မှု</h2>
 <label for="key">Gemini API Key</label>
 <input id="key" type="password" autocomplete="off" placeholder="AIza...">
 <label for="model">Model ID</label>
 <input id="model" type="text" value="models/gemini-2.5-flash-native-audio-preview-09-2025">
</section>

<p class="note">စတင်ရင် overlay၊ အသံ၊ မျက်နှာပြင်ဖမ်းခွင့်တွေ တောင်းပါမယ်။ ဘာသာပြန်စာတန်းက တခြား app အပေါ်မှာ ပေါ်ပါမယ်။ မြန်မာနိုင်ငံမှာ Gemini အတွက် VPN လိုနိုင်ပါတယ်။</p>
</main>
<script>
var $=function(i){return document.getElementById(i)},on=false,F=["lang","orig","ai","voice","key","model"];
function ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
F.forEach(function(k){var v=ld("lt_"+k);if(v!==null)$(k).value=v;$(k).onchange=function(){sv("lt_"+k,this.value.trim())}});
function chips(){[].forEach.call(document.querySelectorAll(".chip"),function(c){c.setAttribute("aria-pressed",c.dataset.v===$("lang").value)})}
[].forEach.call(document.querySelectorAll(".chip"),function(c){c.onclick=function(){$("lang").value=c.dataset.v;sv("lt_lang",c.dataset.v);chips()}});chips();
function vv(){$("ov").textContent=$("orig").value+"%";$("av").textContent=$("ai").value+"%"}
["orig","ai"].forEach(function(k){$(k).oninput=function(){vv();sv("lt_"+k,this.value)}});vv();
window.onStatus=function(o,m){on=o;$("go").dataset.on=o;$("go").textContent=o?"ရပ်မယ်":"စတင်မယ်";var s=$("st");s.textContent=m;s.className="st "+(o?"ok":(/မရ|ပြတ်|လိုပါ|မပေး/.test(m)?"bad":""))};
$("go").onclick=function(){
 if(!window.Android){onStatus(false,"ဒီစာမျက်နှာကို app ထဲမှာပဲ စတင်လို့ရပါတယ်");return}
 if(on){Android.stop();return}
 var k=$("key").value.trim();if(!k){onStatus(false,"API Key လိုပါတယ်");return}
 Android.start(k,$("model").value.trim(),$("voice").value,$("lang").value,+$("orig").value,+$("ai").value)};
if(window.Android&&Android.running())onStatus(true,"🟢 ဘာသာပြန်နေပါတယ်");
</script></body></html>
