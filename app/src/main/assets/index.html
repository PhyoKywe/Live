<title>Live Translate</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14181f;--dim:#5d6676;--line:rgba(255,255,255,.75);--glass:rgba(255,255,255,.55);--acc:#2f6bff;--acc2:#18c6a6;--ok:#12805c;--bad:#c4372b;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:var(--ink);font:400 16px/1.75 "Noto Sans Myanmar",system-ui,sans-serif;background:#f4f7fb;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.bg i:nth-child(1){width:300px;height:300px;background:#bcd3ff;top:-80px;left:-90px}
.bg i:nth-child(2){width:260px;height:260px;background:#b5f0e2;top:38%;right:-110px}
.bg i:nth-child(3){width:280px;height:280px;background:#ffd9e6;bottom:-90px;left:-60px}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 36px)}
h1{font:700 26px/1.5 "Noto Sans Myanmar",sans-serif;margin:0;letter-spacing:-.2px}
.sub{color:var(--dim);font-size:14px;margin:2px 0 0}
.lb{border:0;background:none;padding:0;cursor:pointer;flex:none;border-radius:12px}.lb:active{transform:scale(.94)}
.ab{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(20,24,31,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.ab[hidden]{display:none}
.abc{width:100%;max-width:340px;padding:22px 20px 18px;text-align:center}.abc img{width:100%;border-radius:16px;background:#fff;border:1px solid rgba(20,24,31,.08)}.abc p{margin:14px 0 4px;font-size:18px;font-weight:600}.abc small{color:var(--dim)}.abx{margin-top:14px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-size:15px;padding:9px 28px;cursor:pointer}
.brand{display:flex;align-items:center;gap:12px}.logo{flex:none;border-radius:12px;box-shadow:0 6px 16px rgba(47,107,255,.3)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:0 8px 30px rgba(40,60,110,.09),inset 0 1px 0 rgba(255,255,255,.9)}
.hero{margin-top:14px;padding:20px 16px 14px;display:flex;flex-direction:column;align-items:center}
#go{width:104px;height:104px;border-radius:50%;border:1px solid rgba(255,255,255,.9);cursor:pointer;color:var(--ink);font:700 16px/1.3 "Noto Sans Myanmar",sans-serif;background:radial-gradient(circle at 30% 25%,#fff,rgba(255,255,255,.55) 55%,rgba(200,220,255,.5));box-shadow:0 12px 30px rgba(47,107,255,.22),inset 0 2px 6px #fff,inset 0 -8px 18px rgba(47,107,255,.12);position:relative;transition:transform .15s}
#go:active{transform:scale(.96)}
#go::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid transparent}
#go[data-on="true"]{color:#fff;background:linear-gradient(145deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 12px 34px rgba(47,107,255,.45),inset 0 2px 6px rgba(255,255,255,.5)}
#go[data-on="true"]::after{border-color:rgba(47,107,255,.35);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.28);opacity:0}}
@media (prefers-reduced-motion:reduce){#go[data-on="true"]::after{animation:none}}
.st{margin-top:12px;font-size:14px;color:var(--dim);min-height:26px;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.ok{color:var(--ok);font-weight:600}.st.bad{color:var(--bad)}
.card{margin-top:14px;padding:18px}
.card h2{font:600 14px/1.5 "Noto Sans Myanmar",sans-serif;color:var(--dim);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(20,24,31,.1);background:rgba(255,255,255,.6);color:var(--ink);border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sl{margin-top:4px}.sl+.sl{margin-top:16px}
.sl div{display:flex;justify-content:space-between;font-size:14px}
.sl b{font-weight:600;color:var(--acc)}
input[type=range]{width:100%;height:28px;accent-color:var(--acc);background:none}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 5px}label:first-of-type{margin-top:0}
select,input[type=text],input[type=password]{width:100%;background:rgba(255,255,255,.7);color:var(--ink);border:1px solid rgba(20,24,31,.1);border-radius:14px;padding:11px 14px;font:inherit;font-size:15px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;background:rgba(20,24,31,.06);border-radius:999px;padding:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:999px;font:inherit;font-size:14px;color:var(--dim);cursor:pointer}.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,24,31,.12);font-weight:600}
details{margin-top:14px}summary{cursor:pointer;color:var(--dim);font-size:13px;padding:6px 0}
.chk{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--ink)}.chk input{width:20px;height:20px;accent-color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 0;font-size:13px;color:var(--dim)}.fa{border:0;background:none;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;padding:4px 8px}
.fold{margin-top:10px;padding:0;overflow:hidden}
.fh{width:100%;display:flex;align-items:center;gap:10px;padding:13px 16px;background:none;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.ft{font-weight:600;font-size:15px;white-space:nowrap}
.fs{margin-left:auto;font-size:13px;color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52%}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin:-3px 2px 0 0;transition:transform .2s}
.fold.open .chev{transform:rotate(-135deg);margin-top:3px}
.fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}.fold.open .fb{grid-template-rows:1fr}
.fi{overflow:hidden;min-height:0}.in{padding:2px 16px 16px}.fold:not(.open) .in{visibility:hidden}
@media (prefers-reduced-motion:reduce){.fb,.chev{transition:none}}
.hint{margin:0 0 8px;font-size:13px;color:var(--dim)}
.note{font-size:12.5px;color:var(--dim);margin:16px 6px 0}
</style></head>
